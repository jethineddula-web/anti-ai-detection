<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Better Button</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Source Serif 4", Georgia, serif;
      background: #f7f3ee;
    }
    button {
      background: #c45c26;
      color: #fffdf9;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background: #a34a1d;
    }
  </style>
</head>
<body>
  <button type="button">Start free trial</button>
</body>
</html>
