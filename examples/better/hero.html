<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Better Hero</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Source Serif 4", Georgia, serif;
      background: #f7f3ee;
      color: #1c1917;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 4rem 2rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }
    h1 {
      font-family: "Fraunces", serif;
      font-size: 3.25rem;
      font-weight: 500;
      line-height: 1.1;
      margin: 0 0 1rem;
      letter-spacing: -0.015em;
    }
    p {
      font-size: 1.125rem;
      line-height: 1.6;
      color: #44403c;
      margin-bottom: 2rem;
      max-width: 32rem;
    }
    .primary {
      background: #c45c26;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-family: "Source Serif 4", serif;
      font-size: 1rem;
      cursor: pointer;
    }
    .primary:hover {
      background: #a34a1d;
    }
    .secondary {
      margin-left: 1rem;
      background: transparent;
      border: none;
      color: #57534e;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
    }
    .visual {
      background: #e7e5e4;
      border-radius: 8px;
      min-height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #78716c;
      font-size: 0.875rem;
    }
    @media (max-width: 800px) {
      .wrap { grid-template-columns: 1fr; gap: 2rem; }
      h1 { font-size: 2.25rem; }
      .secondary { display: block; margin: 1rem 0 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <h1>Freight status your ops team can trust</h1>
      <p>One timeline for customs, carrier events, and warehouse slots — written for people who move containers, not generic “workflow” decks.</p>
      <button class="primary" type="button">See a live shipment</button>
      <button class="secondary" type="button">Read the ops guide</button>
    </div>
    <div class="visual">Product screenshot goes here</div>
  </div>
</body>
</html>
