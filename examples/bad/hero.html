<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bad Hero — AI Slop Example</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero {
      text-align: center;
      max-width: 640px;
      padding: 2rem;
    }
    .badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      margin-bottom: 1rem;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #818cf8, #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 0 0 1rem;
    }
    p {
      color: #94a3b8;
      font-size: 1.125rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .ctas {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .primary {
      background: linear-gradient(to right, #6366f1, #9333ea);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      font-weight: 600;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
      cursor: pointer;
    }
    .secondary {
      background: transparent;
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="hero">
    <span class="badge">✨ New · Live now</span>
    <h1>Unlock the future of your workflow</h1>
    <p>A seamless, next-generation platform that brings everything you need into one beautiful place.</p>
    <div class="ctas">
      <button class="primary" type="button">Get Started</button>
      <button class="secondary" type="button">Learn More</button>
    </div>
  </div>
</body>
</html>
